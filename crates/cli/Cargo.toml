[package]
name = "code-intel-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Repogi (Repo Graph Intelligence): local-first code intelligence for AI coding agents"
repository = "https://github.com/thinkgrid-labs/repogi"

[[bin]]
name = "repogi"
path = "src/main.rs"

[dependencies]
code-intel-core.workspace = true
code-intel-store.workspace = true
code-intel-index.workspace = true
code-intel-retrieval.workspace = true
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
blake3.workspace = true
base64 = "0.22"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", features = ["fs"] }

[dev-dependencies]
tempfile.workspace = true
rusqlite.workspace = true

[lints]
workspace = true
