# Builds, tests and packages Repogi release binaries; publication is a separate,
# owner-approved job. See docs/RELEASES.md for the asset contract and procedure.
#
# - Runs only for version tags (v1.2.3, v1.2.3-preview.1) and manual dispatch.
#   There is no pull_request trigger: release credentials never meet PR code.
# - Every job starts with no permissions; only `publish` can write, and it runs
#   only for a tag, after every check passed, behind the `release` environment
#   (configure required reviewers there). It creates a *draft* release; the owner
#   publishes the draft by hand.
# - No caches are restored, so a poisoned cache cannot reach a release build.
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+-*']
  workflow_dispatch:
    inputs:
      publish:
        description: Create a draft release (only when run from a v* tag; needs release-environment approval)
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  prepare:
    name: Resolve version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      commit: ${{ steps.resolve.outputs.commit }}
      epoch: ${{ steps.resolve.outputs.epoch }}
      publish: ${{ steps.resolve.outputs.publish }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve and validate version
        id: resolve
        env:
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          version=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['workspace']['package']['version'])")
          python3 -c "import sys; sys.path.insert(0, 'scripts/release'); import contract; contract.check_version(sys.argv[1])" "$version"
          publish=false
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            if [[ "$tag" != "v$version" ]]; then
              echo "::error::tag $tag does not match the Cargo workspace version $version"
              exit 1
            fi
            if [[ "$GITHUB_EVENT_NAME" == push || "$INPUT_PUBLISH" == true ]]; then
              publish=true
            fi
          elif [[ "$INPUT_PUBLISH" == true ]]; then
            echo "::error::publishing requires running the workflow from a v$version tag"
            exit 1
          fi
          python3 scripts/prepare_source.py
          {
            echo "version=$version"
            echo "commit=$GITHUB_SHA"
            echo "epoch=$(git log -1 --format=%ct)"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"

  notices:
    name: License notices (all targets)
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: "1.98.0"

      - name: Refuse unresolved notices
        run: |
          set -euo pipefail
          for target in $(python3 -c "import sys; sys.path.insert(0, 'scripts/release'); import contract; print(*contract.TARGETS)"); do
            python3 scripts/release/check_notices.py --target "$target" > "notices-$target.json"
          done

  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-15
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.prepare.outputs.version }}
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: "1.98.0"
          targets: ${{ matrix.target }}

      - name: Configure build
        env:
          EXTRA_RUSTFLAGS: ${{ matrix.rustflags }}
        run: |
          set -euo pipefail
          # On Windows runners `python3` can resolve to the Microsoft Store stub.
          if [[ "$RUNNER_OS" == Windows ]]; then echo "PYTHON=python" >> "$GITHUB_ENV"; else echo "PYTHON=python3" >> "$GITHUB_ENV"; fi
          cargo_home="${CARGO_HOME:-$HOME/.cargo}"
          echo "RUSTFLAGS=--remap-path-prefix=$GITHUB_WORKSPACE=repogi --remap-path-prefix=$cargo_home/registry/src=cargo-registry ${EXTRA_RUSTFLAGS:-}" >> "$GITHUB_ENV"
          rustc -vV
          [[ "$(rustc -vV | sed -n 's/^host: //p')" == "$TARGET" ]] || { echo "::error::runner host is not $TARGET"; exit 1; }

      - name: Run tests
        run: cargo test --workspace --locked --no-fail-fast --target "$TARGET" -- --test-threads=1

      - name: Build release executable
        run: cargo build --release --locked -p code-intel-cli --target "$TARGET"

      - name: Check architecture and dynamic dependencies
        run: |
          exe="target/$TARGET/release/repogi"; [[ "$TARGET" == *windows* ]] && exe="$exe.exe"
          echo "EXE=$exe" >> "$GITHUB_ENV"
          "$PYTHON" scripts/release/inspect_binary.py --target "$TARGET" "$exe"

      - name: Smoke-test the executable
        run: '"$PYTHON" scripts/release/smoke.py --version "$VERSION" "$EXE"'

      - name: Package
        env:
          COMMIT: ${{ needs.prepare.outputs.commit }}
          EPOCH: ${{ needs.prepare.outputs.epoch }}
          RUNNER: ${{ matrix.os }}
        run: |
          "$PYTHON" scripts/release/package.py --target "$TARGET" --version "$VERSION" --binary "$EXE" \
            --source-commit "$COMMIT" --source-date-epoch "$EPOCH" --out-dir out \
            --build-environment "GitHub-hosted $RUNNER"

      - name: Upload archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archive-${{ matrix.target }}
          path: out/
          if-no-files-found: error
          retention-days: 7

  assemble:
    name: Assemble release
    needs: [prepare, notices, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      checksums: ${{ steps.assemble.outputs.checksums }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      COMMIT: ${{ needs.prepare.outputs.commit }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: archive-*
          path: artifacts

      - name: Verify payloads and write SHA256SUMS
        id: assemble
        run: |
          set -euo pipefail
          python3 scripts/release/assemble.py --version "$VERSION" --source-commit "$COMMIT" --artifacts artifacts --out release
          python3 scripts/release/assemble.py --version "$VERSION" --verify --out release
          # Later jobs compare downloads against this job output, which no other job can change.
          echo "checksums=$(base64 -w0 release/SHA256SUMS)" >> "$GITHUB_OUTPUT"
          cat release/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release directory
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release/
          if-no-files-found: error
          retention-days: 7

  verify-install:
    name: Install on ${{ matrix.os }}
    needs: [prepare, assemble]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15]
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download release
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release

      - name: Check downloads against assembled checksums
        env:
          CHECKSUMS: ${{ needs.assemble.outputs.checksums }}
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == Windows ]]; then PYTHON=python; else PYTHON=python3; fi
          echo "PYTHON=$PYTHON" >> "$GITHUB_ENV"
          "$PYTHON" -c "import base64, os, sys; sys.exit(open('release/SHA256SUMS', 'rb').read() != base64.b64decode(os.environ['CHECKSUMS']))"
          cd release && "$PYTHON" -c "
          import hashlib, sys
          for line in open('SHA256SUMS'):
              digest, name = line.split()
              if hashlib.sha256(open(name, 'rb').read()).hexdigest() != digest:
                  sys.exit(f'checksum mismatch: {name}')
          "

      - name: Installer regression tests
        env:
          REPOGI_TEST_VERSION: ${{ needs.prepare.outputs.version }}
        # Relative path: Windows Python cannot resolve Git Bash's /d/... form of $PWD.
        run: REPOGI_TEST_ARCHIVES=release "$PYTHON" scripts/release/tests/test_installers.py -v

  mcp-sdk:
    name: MCP SDK check
    needs: [prepare, assemble]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download release
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release

      # This job installs a third-party package, so it uploads nothing; publish
      # re-checks every asset against the assemble job's checksum output.
      - name: Check with the official MCP Python SDK
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/mcp"
          "$RUNNER_TEMP/mcp/bin/pip" install --quiet "mcp==2.3.0"
          mkdir "$RUNNER_TEMP/x"
          tar -xzf "release/repogi-$VERSION-x86_64-unknown-linux-gnu.tar.gz" -C "$RUNNER_TEMP/x"
          "$RUNNER_TEMP/mcp/bin/python" scripts/release/tests/mcp_sdk_check.py "$RUNNER_TEMP/x/repogi-$VERSION-x86_64-unknown-linux-gnu/repogi"

  publish:
    name: Publish draft release
    needs: [prepare, notices, assemble, verify-install, mcp-sdk]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download release
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release

      - name: Verify release directory
        env:
          CHECKSUMS: ${{ needs.assemble.outputs.checksums }}
        run: |
          set -euo pipefail
          python3 -c "import base64, os, sys; sys.exit(open('release/SHA256SUMS', 'rb').read() != base64.b64decode(os.environ['CHECKSUMS']))"
          python3 scripts/release/assemble.py --version "$VERSION" --verify --out release

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: release/SHA256SUMS

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          flags=(--draft --verify-tag --title "Repogi $VERSION")
          [[ "$VERSION" == *-* ]] && flags+=(--prerelease)
          {
            echo "Prebuilt Repogi $VERSION binaries. Verify downloads against \`SHA256SUMS\` (\`sha256sum -c SHA256SUMS --ignore-missing\`)"
            echo "and, optionally, build provenance: \`gh attestation verify <archive> --repo $GITHUB_REPOSITORY\`."
            echo
            echo '```'
            cat release/SHA256SUMS
            echo '```'
          } > notes.md
          gh release create "$tag" release/* "${flags[@]}" --notes-file notes.md --repo "$GITHUB_REPOSITORY"
