[workspace]
members = ["crates/core", "crates/store", "crates/index", "crates/retrieval", "crates/cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
code-intel-core = { path = "crates/core" }
code-intel-store = { path = "crates/store" }
code-intel-index = { path = "crates/index" }
code-intel-retrieval = { path = "crates/retrieval" }
anyhow = "1.0"
blake3 = "1.8"
clap = { version = "4.6", features = ["derive"] }
ignore = "0.4"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.27"
tree-sitter = "0.24.7"
tree-sitter-typescript = "0.23.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"

