<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="484" viewBox="0 0 1040 484" role="img" aria-labelledby="title desc">
  <title id="title">How Repogi works</title>
  <desc id="desc">Source code (TypeScript and TSX) and project knowledge (Markdown, PRDs and ADRs) are indexed into the rebuildable Repogi index at .code-intel/index.db, which holds the static code graph, document search and knowledge relationships. Retrieval reads the index to provide context, trace, investigation and change impact as source-backed, bounded results, exposed to developers and coding agents through the CLI and read-only MCP tools. Project memory is a separate durable store at .repogi/memory.db that survives re-indexing. Memories enter it only through explicit review with the CLI, their evidence is re-verified against the index, and approved memories are optionally recalled by retrieval.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path class="tip" d="M0 0L8 4L0 8Z"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; fill: #1F2328; }
    .bg { fill: #F6F8FA; stroke: #D1D9E0; }
    .box { fill: #FFFFFF; stroke: #D1D9E0; }
    .memory { fill: #EEF8F5; stroke: #0E7C66; }
    .rule { stroke: #D1D9E0; }
    .link { fill: none; stroke: #0E7C66; stroke-width: 1.5; }
    .check { fill: none; stroke: #818B98; stroke-width: 1.5; stroke-dasharray: 2 4; stroke-linecap: round; }
    .optional { stroke-dasharray: 6 4; }
    .tip { fill: #0E7C66; }
    .title { font-size: 17px; font-weight: 600; }
    .item { font-size: 14px; }
    .note { font-size: 13px; fill: #59636E; }
    .path { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 13px; }
    .tag { font-size: 11px; font-weight: 600; letter-spacing: 1px; fill: #59636E; }
    .tag.accent, .label { fill: #0E7C66; }
    .label { font-size: 13px; }
    @media (prefers-color-scheme: dark) {
      text { fill: #F0F6FC; }
      .bg { fill: #0D1117; stroke: #3D444D; }
      .box { fill: #151B23; stroke: #3D444D; }
      .memory { fill: #0F2620; stroke: #3FB995; }
      .rule { stroke: #3D444D; }
      .link { stroke: #3FB995; }
      .check { stroke: #9198A1; }
      .tip { fill: #3FB995; }
      .note, .tag { fill: #9198A1; }
      .tag.accent, .label { fill: #3FB995; }
    }
  </style>

  <rect class="bg" x="0.5" y="0.5" width="1039" height="483" rx="12"/>

  <!-- Inputs -->
  <rect class="box" x="28" y="32" width="208" height="100" rx="8"/>
  <text class="title" x="48" y="72">Source code</text>
  <text class="item" x="48" y="100">TypeScript · TSX</text>

  <rect class="box" x="28" y="152" width="208" height="100" rx="8"/>
  <text class="title" x="48" y="192">Project knowledge</text>
  <text class="item" x="48" y="220">Markdown · PRDs · ADRs</text>

  <!-- Rebuildable index -->
  <rect class="box" x="296" y="32" width="220" height="220" rx="8"/>
  <text class="title" x="316" y="66">Repogi index</text>
  <text class="item" x="316" y="98">Static code graph</text>
  <text class="item" x="316" y="121">Document search</text>
  <text class="item" x="316" y="144">Knowledge relationships</text>
  <line class="rule" x1="316" y1="186" x2="496" y2="186"/>
  <text class="path" x="316" y="212">.code-intel/index.db</text>
  <text class="tag" x="316" y="235">REBUILDABLE</text>

  <!-- Retrieval -->
  <rect class="box" x="576" y="32" width="200" height="220" rx="8"/>
  <text class="title" x="596" y="66">Retrieval</text>
  <text class="item" x="596" y="98">Context</text>
  <text class="item" x="596" y="121">Trace</text>
  <text class="item" x="596" y="144">Investigate</text>
  <text class="item" x="596" y="167">Change impact</text>
  <line class="rule" x1="596" y1="186" x2="756" y2="186"/>
  <text class="note" x="596" y="212">Source-backed,</text>
  <text class="note" x="596" y="232">bounded results</text>

  <!-- Interfaces -->
  <rect class="box" x="836" y="32" width="176" height="220" rx="8"/>
  <text class="title" x="856" y="66">CLI + MCP</text>
  <text class="item" x="856" y="98">Developers</text>
  <text class="item" x="856" y="121">Coding agents</text>
  <line class="rule" x1="856" y1="186" x2="992" y2="186"/>
  <text class="note" x="856" y="212">MCP tools are</text>
  <text class="note" x="856" y="232">read-only</text>

  <!-- Durable memory -->
  <rect class="memory" x="296" y="332" width="480" height="120" rx="8"/>
  <text class="title" x="316" y="366">Project memory</text>
  <text class="tag accent" x="756" y="365" text-anchor="end">DURABLE</text>
  <text class="item" x="316" y="396">Reviewed claims, evidence snapshots and review history</text>
  <text class="path" x="316" y="430">.repogi/memory.db</text>
  <text class="note" x="756" y="430" text-anchor="end">Survives re-indexing</text>

  <!-- Indexing and retrieval flow -->
  <path class="link" d="M236 82H294" marker-end="url(#arrow)"/>
  <path class="link" d="M236 202H294" marker-end="url(#arrow)"/>
  <path class="link" d="M516 142H574" marker-end="url(#arrow)"/>
  <path class="link" d="M776 142H834" marker-end="url(#arrow)"/>

  <!-- Memory relationships -->
  <path class="check" d="M406 330V254"/>
  <text class="note" x="418" y="297">evidence re-verified</text>
  <path class="link optional" d="M676 330V254" marker-end="url(#arrow)"/>
  <text class="label" x="688" y="297">optional recall</text>
  <path class="link" d="M924 252V392H778" marker-end="url(#arrow)"/>
  <text class="label" x="850" y="382" text-anchor="middle">explicit review</text>
  <text class="note" x="850" y="412" text-anchor="middle">CLI only</text>
</svg>
