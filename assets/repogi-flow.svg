<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
  <title id="title">How Repogi works: a local-first code graph for AI agents</title>
  <desc id="desc">Flow diagram: TypeScript/TSX repository, Tree-sitter parsing and static binding, SQLite graph with source evidence, code intelligence features including references, dependencies and Git change impact, then CLI and MCP interfaces for AI coding agents. Animated mint dashed edges visualize data flow, and stop when reduced motion is preferred.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0D1721"/><stop offset="1" stop-color="#1B2C38"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#B7FFE9"/><stop offset="1" stop-color="#57D8B6"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#66DABB"/></marker>
  </defs>
  <style>
    .flow { stroke-dasharray: 7 12; animation: run 7s linear infinite; }
    .ping { animation: ping 4s ease-in-out infinite; } .ping.two { animation-delay:-1.6s; }
    @keyframes run { to { stroke-dashoffset:-114; } }
    @keyframes ping { 0%,100% { opacity:.55; } 50% { opacity:1; } }
    @media (prefers-reduced-motion: reduce) { .flow,.ping { animation:none; } }
    .step{fill:#152833;stroke:#395D5C;stroke-width:2}.small{fill:#1A303B;stroke:#36585B;stroke-width:1.5}
    .eyebrow{font:700 15px Inter,ui-sans-serif,system-ui,sans-serif;letter-spacing:2.3px;fill:#76DCC4}
    .headline{font:700 21px Inter,ui-sans-serif,system-ui,sans-serif;fill:#F2FAF7}
    .detail{font:400 16px Inter,ui-sans-serif,system-ui,sans-serif;fill:#ADC9C8}
    .feature{font:650 20px Inter,ui-sans-serif,system-ui,sans-serif;fill:#EAF8F3}
    .caption{font:400 15px Inter,ui-sans-serif,system-ui,sans-serif;fill:#B7D0CE}
  </style>
  <rect x="1" y="1" width="1198" height="538" rx="20" fill="url(#panel)" stroke="#324C52" stroke-width="2"/>
  <text x="45" y="52" class="eyebrow">HOW REPOGI WORKS</text>
  <text x="45" y="91" style="font:700 29px Inter,ui-sans-serif,system-ui,sans-serif;fill:#F3FAF7">From source code to traceable answers</text>
  <g>
    <rect class="step" x="45" y="134" width="245" height="151" rx="18"/>
    <rect class="step" x="335" y="134" width="245" height="151" rx="18"/>
    <rect class="step" x="625" y="134" width="245" height="151" rx="18"/>
    <rect class="step" x="915" y="134" width="240" height="151" rx="18"/>
    <circle class="ping" cx="75" cy="168" r="8" fill="#6FE4C4"/>
    <circle class="ping two" cx="365" cy="168" r="8" fill="#6FE4C4"/>
    <circle class="ping" cx="655" cy="168" r="8" fill="#6FE4C4"/>
    <circle class="ping two" cx="945" cy="168" r="8" fill="#6FE4C4"/>
    <text class="eyebrow" x="94" y="174">01 / SOURCE</text>
    <text class="eyebrow" x="384" y="174">02 / INDEX</text>
    <text class="eyebrow" x="674" y="174">03 / GRAPH</text>
    <text class="eyebrow" x="964" y="174">04 / ACCESS</text>
    <text class="headline" x="66" y="218">TypeScript / TSX</text>
    <text class="detail" x="66" y="248">Your local repository</text>
    <text class="headline" x="356" y="218">Parse + bind</text>
    <text class="detail" x="356" y="248">Tree-sitter · BLAKE3</text>
    <text class="headline" x="646" y="218">SQLite graph</text>
    <text class="detail" x="646" y="248">Typed, sourced edges</text>
    <text class="headline" x="936" y="218">CLI + MCP</text>
    <text class="detail" x="936" y="248">Coding agent clients</text>
  </g>
  <g fill="none" stroke="#64DDBD" stroke-width="3" marker-end="url(#arrow)">
    <path d="M291 210H326"/><path d="M581 210H616"/><path d="M871 210H906"/>
  </g>
  <g fill="none" stroke="url(#accent)" stroke-width="3" class="flow"><path d="M291 210H326"/><path d="M581 210H616"/><path d="M871 210H906"/></g>
  <path d="M747 286V315M225 315H988M225 315V340M600 315V340M988 315V340" fill="none" stroke="#5DB7AA" stroke-width="2" opacity=".72"/>
  <g>
    <rect class="small" x="45" y="341" width="350" height="92" rx="15"/>
    <rect class="small" x="425" y="341" width="350" height="92" rx="15"/>
    <rect class="small" x="805" y="341" width="350" height="92" rx="15"/>
    <text class="feature" x="67" y="376">Navigate references</text>
    <text class="caption" x="67" y="404">Definitions, call sites and source locations</text>
    <text class="feature" x="447" y="376">Trace dependencies</text>
    <text class="caption" x="447" y="404">Direct and transitive relationships</text>
    <text class="feature" x="827" y="376">Analyze change impact</text>
    <text class="caption" x="827" y="404">Git snapshots and test candidates</text>
  </g>
  <rect x="45" y="462" width="1110" height="48" rx="12" fill="#163C3B" stroke="#44796D" stroke-width="1"/>
  <circle cx="70" cy="485" r="6" fill="#90EFD1"/>
  <text x="89" y="491" style="font:600 17px Inter,ui-sans-serif,system-ui,sans-serif;fill:#D8F8EA">Evidence first:</text>
  <text x="232" y="491" style="font:400 17px Inter,ui-sans-serif,system-ui,sans-serif;fill:#C9DED8">source ranges · resolution status · explicit uncertainty and limits</text>
</svg>
