<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="title desc">
  <title id="title">Repogi — Repo Graph Intelligence</title>
  <desc id="desc">Dark charcoal banner with a mint source graph icon and the words Repogi, Repo Graph Intelligence, Know the code. Follow the evidence.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0B111B"/><stop offset="1" stop-color="#172937"/></linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#B5FCE6"/><stop offset="1" stop-color="#50D5B7"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#256E64" stop-opacity=".43"/><stop offset="1" stop-color="#256E64" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#9ECFBE" opacity=".11"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    .path { stroke-dasharray: 7 11; animation: drift 12s linear infinite; }
    .pulse { transform-box: fill-box; transform-origin: center; animation: breathe 3s ease-in-out infinite; }
    .pulse.two { animation-delay: -1s; } .pulse.three { animation-delay: -2s; }
    @keyframes drift { to { stroke-dashoffset: -144; } }
    @keyframes breathe { 0%,100% { opacity:.75; transform:scale(1); } 50% { opacity:1; transform:scale(1.13); } }
    @media (prefers-reduced-motion: reduce) { .path,.pulse { animation:none; } }
  </style>
  <rect width="1200" height="350" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="350" rx="24" fill="url(#dots)"/>
  <circle cx="246" cy="174" r="216" fill="url(#halo)"/>
  <path d="M990 0L1200 0L1200 350L1100 350" fill="none" stroke="#81DAC5" stroke-opacity=".09" stroke-width="2"/>
  <path d="M0 302H1200" stroke="#B5FCE6" stroke-opacity=".10"/>
  <g transform="translate(70 54)">
    <rect width="238" height="238" rx="47" fill="#162F35" fill-opacity=".62" stroke="#72DEC7" stroke-opacity=".29" stroke-width="2"/>
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M48 154L101 102L161 80L192 128L154 186L88 192Z" stroke="#5ACCB5" opacity=".33" stroke-width="3"/>
      <path class="path" d="M48 154L101 102L161 80L192 128L154 186L88 192L48 154M101 102L154 186M101 102L88 192" stroke="url(#mint)" stroke-width="3"/>
      <path d="M101 102L154 186" stroke="#89F4D6" stroke-opacity=".45" stroke-width="3"/>
    </g>
    <g fill="#102D30" stroke="#9EF6DA" stroke-width="4">
      <circle class="pulse" cx="48" cy="154" r="11"/><circle class="pulse two" cx="101" cy="102" r="13"/>
      <circle class="pulse three" cx="161" cy="80" r="10"/><circle cx="192" cy="128" r="11"/>
      <circle class="pulse two" cx="154" cy="186" r="13"/><circle cx="88" cy="192" r="10"/>
    </g>
    <circle cx="101" cy="102" r="4" fill="#F4FFF8"/>
    <circle cx="154" cy="186" r="4" fill="#F4FFF8"/>
  </g>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
    <text x="365" y="99" fill="#7DE6CA" font-size="18" font-weight="700" letter-spacing="4">REPO GRAPH INTELLIGENCE</text>
    <text x="359" y="204" fill="#F5FAF8" font-size="100" font-weight="800" letter-spacing="-5">repogi</text>
    <text x="365" y="257" fill="#C4DBD6" font-size="26" font-weight="500">Know the code. Follow the evidence.</text>
    <rect x="365" y="284" width="132" height="3" rx="1.5" fill="url(#mint)"/>
    <text x="509" y="294" fill="#8DB2B5" font-size="15" letter-spacing=".6">LOCAL FIRST  ·  RUST  ·  CLI + MCP</text>
  </g>
</svg>
